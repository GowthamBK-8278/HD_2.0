<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 200" width="180" height="200" class="shinchan-svg-canvas">
  <defs>
    <filter id="comic-drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#000000"/>
    </filter>
    <linearGradient id="shirt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3333"/>
      <stop offset="100%" stop-color="#D61824"/>
    </linearGradient>
    <linearGradient id="shorts-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE033"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
  </defs>

  <!-- Whole Body Group for Idle Swaying -->
  <g class="shinchan-sitting-body" filter="url(#comic-drop-shadow)">

    <!-- ================= DANGLING LEGS (HANGING OVER LEDGE) ================= -->
    <!-- Left Leg & Shoe (Kicking Animation) -->
    <g class="shinchan-leg-left">
      <!-- Thigh & Calf -->
      <path d="M 66 138 L 64 165 C 64 170 76 170 78 165 L 82 138 Z" 
            fill="#FEB481" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
      <!-- White Sock -->
      <path d="M 64 160 L 64 168 C 64 171 77 171 78 168 L 78 160 Z" 
            fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
      <!-- Yellow Cartoon Shoe -->
      <ellipse cx="69" cy="173" rx="10" ry="6" fill="#FFD400" stroke="#000000" stroke-width="2.8"/>
      <path d="M 60 174 Q 69 178 78 174" stroke="#000000" stroke-width="2" fill="none"/>
    </g>

    <!-- Right Leg & Shoe (Opposite Kicking Animation) -->
    <g class="shinchan-leg-right">
      <!-- Thigh & Calf -->
      <path d="M 98 138 L 96 165 C 96 170 108 170 110 165 L 114 138 Z" 
            fill="#FEB481" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
      <!-- White Sock -->
      <path d="M 96 160 L 96 168 C 96 171 109 171 110 168 L 110 160 Z" 
            fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
      <!-- Yellow Cartoon Shoe -->
      <ellipse cx="103" cy="173" rx="10" ry="6" fill="#FFD400" stroke="#000000" stroke-width="2.8"/>
      <path d="M 94 174 Q 103 178 112 174" stroke="#000000" stroke-width="2" fill="none"/>
    </g>

    <!-- ================= YELLOW SHORTS (SITTING BOTTOM) ================= -->
    <path class="shinchan-shorts" 
          d="M 52 122 C 50 135 56 144 72 144 L 88 141 L 106 144 C 122 144 128 135 126 122 Z" 
          fill="url(#shorts-grad)" stroke="#000000" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Shorts Crotch Crease -->
    <path d="M 88 128 L 88 141" stroke="#000000" stroke-width="2.5"/>

    <!-- ================= RED SHIRT TORSO ================= -->
    <path class="shinchan-shirt" 
          d="M 44 94 C 44 86 64 82 88 82 C 112 82 132 86 132 94 L 128 124 C 118 127 106 125 88 125 C 70 125 58 127 48 124 Z" 
          fill="url(#shirt-grad)" stroke="#000000" stroke-width="3.5" stroke-linejoin="round"/>
          
    <!-- Yellow Shirt Collar -->
    <path d="M 74 84 Q 88 96 102 84 Q 88 89 74 84 Z" 
          fill="#FFD400" stroke="#000000" stroke-width="2.5"/>

    <!-- ================= SHINCHAN ICONIC POTATO HEAD ================= -->
    <!-- Head Base with Chubby Cheeks -->
    <path id="shinchan-head-shape" 
          d="M 40 68 C 24 61 22 34 32 18 C 42 2 64 -2 93 0 C 123 2 146 18 144 41 C 142 58 128 64 138 78 C 146 90 134 106 112 106 C 90 106 60 96 40 68 Z" 
          fill="#FEB481" stroke="#000000" stroke-width="3.8" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Shiny Jet-Black Hair -->
    <path d="M 36 22 C 44 6 64 0 93 0 C 122 0 143 14 144 36 C 136 18 116 6 93 6 C 68 6 48 12 36 22 Z" 
          fill="#1E1E24" stroke="#000000" stroke-width="2"/>
    <path d="M 32 18 C 28 28 26 42 33 56 C 30 41 30 28 32 18 Z" 
          fill="#1E1E24"/>

    <!-- Ear -->
    <path d="M 24 38 C 18 38 18 52 26 54 C 22 48 22 42 24 38 Z" 
          fill="#FEB481" stroke="#000000" stroke-width="3"/>
    <path d="M 22 44 Q 24 48 26 46" 
          fill="none" stroke="#000000" stroke-width="2"/>

    <!-- Rosy Blushing Cheeks -->
    <ellipse cx="52" cy="68" rx="10" ry="7" fill="#FF7088" opacity="0.85"/>
    <ellipse cx="122" cy="78" rx="11" ry="8" fill="#FF7088" opacity="0.85"/>

    <!-- Giant Bushy Eyebrows (Wiggle Animation) -->
    <g class="shinchan-eyebrow-left">
      <path d="M 42 24 C 53 8 74 8 80 18 C 72 14 56 14 42 24 Z" 
            fill="#000000" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
    </g>
    <g class="shinchan-eyebrow-right">
      <path d="M 90 18 C 100 6 123 8 132 22 C 120 14 106 14 90 18 Z" 
            fill="#000000" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
    </g>

    <!-- Big Mischievous Anime Eyes (Blink Animation) -->
    <g class="shinchan-eye-left">
      <ellipse cx="64" cy="34" rx="8.5" ry="11.5" fill="#000000"/>
      <ellipse cx="62" cy="31" rx="3.5" ry="4.8" fill="#FFFFFF"/>
      <circle cx="66" cy="38" r="1.6" fill="#FFFFFF"/>
    </g>
    <g class="shinchan-eye-right">
      <ellipse cx="106" cy="36" rx="8.5" ry="11.5" fill="#000000"/>
      <ellipse cx="104" cy="33" rx="3.5" ry="4.8" fill="#FFFFFF"/>
      <circle cx="108" cy="40" r="1.6" fill="#FFFFFF"/>
    </g>

    <!-- Laughing Open Mouth (Laugh Animation) -->
    <g class="shinchan-mouth">
      <path d="M 70 60 Q 88 52 104 60 Q 88 88 70 60 Z" 
            fill="#800C16" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
      <path d="M 76 69 Q 88 62 100 68 Q 88 84 76 69 Z" 
            fill="#FF6584"/>
    </g>

    <!-- ================= ARMS & HANDS ================= -->
    <!-- Left Hand: Casually Resting on Top Ledge -->
    <g class="shinchan-arm-left">
      <path d="M 46 96 C 36 102 32 115 36 128 C 38 135 44 140 52 138 C 58 136 60 128 56 122 C 54 116 52 106 50 96 Z" 
            fill="#FEB481" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
      <!-- Red Sleeve -->
      <path d="M 44 94 C 38 100 42 108 50 106 L 50 94 Z" 
            fill="url(#shirt-grad)" stroke="#000000" stroke-width="2.5"/>
      <!-- Fingers gripping ledge -->
      <path d="M 44 135 Q 48 141 52 137" stroke="#000000" stroke-width="2.5" fill="none"/>
    </g>

    <!-- Right Hand: Joyful Peace Sign ✌️ (Peace Wave Animation) -->
    <g class="shinchan-arm-right">
      <!-- Arm going up-right -->
      <path d="M 126 94 C 136 100 146 96 152 86 C 156 80 156 74 150 70 C 144 68 138 74 134 82 L 126 94 Z" 
            fill="#FEB481" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
      <!-- Red Sleeve -->
      <path d="M 124 94 C 130 96 134 90 134 84 L 126 94 Z" 
            fill="url(#shirt-grad)" stroke="#000000" stroke-width="2.5"/>
      <!-- Peace Sign Fingers ✌️ -->
      <!-- Index Finger -->
      <path d="M 148 70 L 156 50 C 158 46 164 48 162 54 L 155 70 Z" 
            fill="#FEB481" stroke="#000000" stroke-width="2.8" stroke-linejoin="round"/>
      <!-- Middle Finger -->
      <path d="M 153 71 L 167 56 C 170 52 176 56 172 61 L 157 75 Z" 
            fill="#FEB481" stroke="#000000" stroke-width="2.8" stroke-linejoin="round"/>
      <!-- Folded Thumb & other fingers -->
      <circle cx="148" cy="74" r="6" fill="#FEB481" stroke="#000000" stroke-width="2.5"/>
    </g>

  </g>
</svg>