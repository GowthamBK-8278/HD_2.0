<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240" class="shinchan-pulling-svg">
  <defs>
    <filter id="pull-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#000000"/>
    </filter>
    <!-- Flannel plaid jacket pattern -->
    <pattern id="flannel-plaid" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#607D8B"/>
      <path d="M 0 6 L 12 6 M 6 0 L 6 12" stroke="#455A64" stroke-width="2.5"/>
      <path d="M 0 0 L 12 12 M 12 0 L 0 12" stroke="#37474F" stroke-width="0.8" opacity="0.4"/>
    </pattern>
  </defs>

  <g filter="url(#pull-shadow)" class="shinchan-pull-body">

    <!-- Sweat Drop (Anime Effort) -->
    <g class="anime-sweat-drop">
      <path d="M 60 25 C 55 15 65 10 65 10 C 65 10 75 15 70 25 C 67 30 63 30 60 25 Z" 
            fill="#38BDF8" stroke="#000000" stroke-width="2"/>
    </g>

    <!-- Strain Motion Lines -->
    <g class="strain-lines" stroke="#FFD400" stroke-width="3" stroke-linecap="round">
      <line x1="25" y1="110" x2="10" y2="105"/>
      <line x1="28" y1="125" x2="12" y2="125"/>
      <line x1="32" y1="140" x2="16" y2="145"/>
    </g>

    <!-- Back Braced Leg (Left Leg) -->
    <g class="pull-leg-back">
      <!-- Black Cargo Short Leg -->
      <path d="M 120 150 L 145 175 L 132 188 L 108 160 Z" 
            fill="#212529" stroke="#000000" stroke-width="3.5" stroke-linejoin="round"/>
      <!-- Calf -->
      <path d="M 140 176 L 160 196 C 164 200 158 205 152 202 L 133 186 Z" 
            fill="#FEB481" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
      <!-- Grey Sneaker Braced on Ground -->
      <ellipse cx="168" cy="208" rx="15" ry="9" fill="#9E9E9E" stroke="#000000" stroke-width="3"/>
      <path d="M 155 210 Q 168 214 180 208" stroke="#000000" stroke-width="2.5" fill="none"/>
      <rect x="156" y="212" width="22" height="4" rx="2" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    </g>

    <!-- Front Braced Leg (Right Leg digging into floor) -->
    <g class="pull-leg-front">
      <!-- Black Cargo Short Leg -->
      <path d="M 85 155 L 75 185 L 94 192 L 108 160 Z" 
            fill="#212529" stroke="#000000" stroke-width="3.5" stroke-linejoin="round"/>
      <!-- Calf -->
      <path d="M 76 186 L 72 210 C 72 215 82 216 84 210 L 92 190 Z" 
            fill="#FEB481" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
      <!-- Grey Sneaker -->
      <ellipse cx="76" cy="216" rx="16" ry="8" fill="#9E9E9E" stroke="#000000" stroke-width="3"/>
      <rect x="64" y="218" width="24" height="4" rx="2" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    </g>

    <!-- Torso Leaning Back (Streetwear Plaid Open Flannel + White Tee) -->
    <!-- White Undershirt -->
    <path d="M 90 105 L 125 115 L 115 155 L 85 145 Z" 
          fill="#FFFFFF" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
    <!-- Blue-Grey Flannel Jacket Sides -->
    <path d="M 78 100 L 94 104 L 88 152 L 72 144 Z" 
          fill="url(#flannel-plaid)" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 122 113 L 138 120 L 130 162 L 114 154 Z" 
          fill="url(#flannel-plaid)" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>

    <!-- Potato Head Leaning Back with Effort -->
    <!-- Head Base with Chubby Cheeks -->
    <path d="M 78 80 C 62 76 56 50 68 34 C 80 18 104 12 132 18 C 160 24 178 44 172 68 C 166 84 150 88 156 102 C 162 114 148 128 126 124 C 104 120 86 102 78 80 Z" 
          fill="#FEB481" stroke="#000000" stroke-width="3.8" stroke-linejoin="round"/>

    <!-- Shiny Jet Black Hair -->
    <path d="M 72 38 C 82 22 104 14 132 18 C 160 22 176 38 172 58 C 164 42 144 30 124 28 C 100 26 82 30 72 38 Z" 
          fill="#1E1E24" stroke="#000000" stroke-width="2"/>
    <path d="M 68 34 C 62 44 60 56 66 70 C 64 56 64 44 68 34 Z" fill="#1E1E24"/>

    <!-- Ear -->
    <path d="M 58 54 C 52 52 50 66 58 70 C 56 64 56 58 58 54 Z" 
          fill="#FEB481" stroke="#000000" stroke-width="3"/>

    <!-- Big Effort Eyebrows (Knitted in exertion) -->
    <path d="M 88 38 C 98 26 118 28 124 38 C 116 34 102 34 88 38 Z" 
          fill="#000000" stroke="#000000" stroke-width="2.5"/>
    <path d="M 132 38 C 142 30 160 36 166 48 C 156 42 144 40 132 38 Z" 
          fill="#000000" stroke="#000000" stroke-width="2.5"/>

    <!-- Wide Determined Anime Eyes with Straining Concentric Highlights -->
    <ellipse cx="106" cy="50" rx="9" ry="12" fill="#000000"/>
    <ellipse cx="104" cy="47" rx="4" ry="5" fill="#FFFFFF"/>
    <circle cx="108" cy="54" r="1.8" fill="#FFFFFF"/>

    <ellipse cx="146" cy="56" rx="9" ry="12" fill="#000000"/>
    <ellipse cx="144" cy="53" rx="4" ry="5" fill="#FFFFFF"/>
    <circle cx="148" cy="60" r="1.8" fill="#FFFFFF"/>

    <!-- Rosy Blushing Cheeks -->
    <ellipse cx="94" cy="78" rx="10" ry="7" fill="#FF7088" opacity="0.85"/>
    <ellipse cx="156" cy="84" rx="11" ry="8" fill="#FF7088" opacity="0.85"/>

    <!-- Determined Round Effort Mouth (Shouting "HEAVE-HO!") -->
    <ellipse cx="125" cy="78" rx="8" ry="10" fill="#E8222E" stroke="#000000" stroke-width="3"/>
    <ellipse cx="125" cy="80" rx="5" ry="6" fill="#780812"/>

    <!-- Both Arms Reaching Forward Gripping the Rope -->
    <!-- Left Arm & Sleeve -->
    <path d="M 72 108 L 40 120 C 34 122 34 132 42 134 L 75 125 Z" 
          fill="url(#flannel-plaid)" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
    <!-- Left Hand Clenched on Rope -->
    <circle cx="34" cy="126" r="10" fill="#FEB481" stroke="#000000" stroke-width="3"/>
    <path d="M 30 120 L 38 126 M 28 125 L 36 131" stroke="#000000" stroke-width="2"/>

    <!-- Right Arm & Sleeve -->
    <path d="M 88 116 L 48 132 C 42 134 42 144 50 146 L 90 132 Z" 
          fill="url(#flannel-plaid)" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
    <!-- Right Hand Clenched on Rope -->
    <circle cx="44" cy="138" r="10" fill="#FEB481" stroke="#000000" stroke-width="3"/>
    <path d="M 40 132 L 48 138 M 38 137 L 46 143" stroke="#000000" stroke-width="2"/>

    <!-- Rope Section Running Through His Hands -->
    <path d="M 0 132 L 60 132" stroke="#D4A373" stroke-width="7" stroke-linecap="round" stroke-dasharray="8 4"/>

  </g>
</svg>
