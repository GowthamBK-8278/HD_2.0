<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="100%" height="100%" class="streetwear-svg-canvas">
  <defs>
    <filter id="street-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#000000"/>
    </filter>
    <pattern id="street-plaid" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#78909C"/>
      <path d="M 0 5 L 10 5 M 5 0 L 5 10" stroke="#455A64" stroke-width="2"/>
      <path d="M 0 0 L 10 10 M 10 0 L 0 10" stroke="#37474F" stroke-width="0.8" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Whole Shinchan Body Group -->
  <g class="streetwear-body" filter="url(#street-shadow)">

    <!-- Shadow under shoes -->
    <ellipse cx="100" cy="245" rx="55" ry="10" fill="#000000" opacity="0.25"/>

    <!-- Left Leg (Straight Stance) -->
    <g class="street-leg-left">
      <!-- Black Cargo Short Leg -->
      <path d="M 68 152 L 64 185 L 88 185 L 94 152 Z" 
            fill="#212529" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
      <!-- Calf -->
      <path d="M 72 185 L 70 215 C 70 220 80 220 82 215 L 84 185 Z" 
            fill="#FEB481" stroke="#000000" stroke-width="3"/>
      <!-- Grey Streetwear Sneaker with laces -->
      <ellipse cx="76" cy="225" rx="16" ry="9" fill="#9E9E9E" stroke="#000000" stroke-width="3"/>
      <path d="M 64 225 Q 76 229 88 225" stroke="#000000" stroke-width="2" fill="none"/>
      <rect x="66" y="228" width="20" height="4" rx="2" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    </g>

    <!-- Right Leg (Slightly Angled Out) -->
    <g class="street-leg-right">
      <!-- Black Cargo Short Leg -->
      <path d="M 106 152 L 112 185 L 136 185 L 132 152 Z" 
            fill="#212529" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
      <!-- Calf -->
      <path d="M 116 185 L 118 215 C 118 220 128 220 130 215 L 128 185 Z" 
            fill="#FEB481" stroke="#000000" stroke-width="3"/>
      <!-- Grey Streetwear Sneaker with laces -->
      <ellipse cx="126" cy="225" rx="16" ry="9" fill="#9E9E9E" stroke="#000000" stroke-width="3"/>
      <path d="M 114 225 Q 126 229 138 225" stroke="#000000" stroke-width="2" fill="none"/>
      <rect x="116" y="228" width="20" height="4" rx="2" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    </g>

    <!-- Black Cargo Shorts Waist & Crotch -->
    <path d="M 64 140 C 64 156 78 158 100 158 C 122 158 136 156 136 140 Z" 
          fill="#212529" stroke="#000000" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- White Undershirt -->
    <path d="M 72 105 L 128 105 L 126 148 L 74 148 Z" 
          fill="#FFFFFF" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>

    <!-- Open Plaid Flannel Shirt (Jacket Left Panel) -->
    <path d="M 52 102 C 52 120 54 145 68 152 L 78 150 L 76 104 Z" 
          fill="url(#street-plaid)" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>

    <!-- Open Plaid Flannel Shirt (Jacket Right Panel) -->
    <path d="M 148 102 C 148 120 146 145 132 152 L 122 150 L 124 104 Z" 
          fill="url(#street-plaid)" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>

    <!-- Left Arm: Casually Clenched Down -->
    <g class="street-arm-left">
      <!-- Sleeve -->
      <path d="M 54 104 L 40 126 L 52 134 L 66 112 Z" 
            fill="url(#street-plaid)" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
      <!-- Forearm & Clenched Fist -->
      <path d="M 42 128 L 38 142" stroke="#FEB481" stroke-width="12" stroke-linecap="round"/>
      <circle cx="38" cy="144" r="8" fill="#FEB481" stroke="#000000" stroke-width="2.5"/>
    </g>

    <!-- RIGHT ARM: RAISED HIGH IN AIR WITH PUMPING FIST ✊ (Exact pose from photo!) -->
    <g class="street-arm-right-fist">
      <!-- Upper Arm & Sleeve reaching up -->
      <path d="M 146 104 L 160 76 L 146 68 L 132 96 Z" 
            fill="url(#street-plaid)" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
      <!-- Forearm extending upwards -->
      <path d="M 154 74 L 162 48" stroke="#FEB481" stroke-width="13" stroke-linecap="round"/>
      <!-- Clenched Victory Fist ✊ -->
      <ellipse cx="163" cy="42" rx="9" ry="10" fill="#FEB481" stroke="#000000" stroke-width="2.8"/>
      <!-- Folded Knuckles -->
      <path d="M 158 38 Q 164 36 170 40" stroke="#000000" stroke-width="2" fill="none"/>
      <path d="M 156 42 Q 162 42 168 45" stroke="#000000" stroke-width="1.8" fill="none"/>
    </g>

    <!-- Shinchan Head (From photo: iconic chubby cheek potato shape) -->
    <path id="street-head" 
          d="M 46 72 C 30 65 28 38 38 22 C 48 6 70 2 99 4 C 129 6 152 22 150 45 C 148 62 134 68 144 82 C 152 94 140 110 118 110 C 96 110 66 100 46 72 Z" 
          fill="#FEB481" stroke="#000000" stroke-width="3.8" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Shiny Jet Black Hair -->
    <path d="M 42 26 C 50 10 70 4 99 4 C 128 4 149 18 150 40 C 142 22 122 10 99 10 C 74 10 54 16 42 26 Z" 
          fill="#1E1E24" stroke="#000000" stroke-width="2"/>
    <path d="M 38 22 C 34 32 32 46 39 60 C 36 45 36 32 38 22 Z" fill="#1E1E24"/>

    <!-- Ear -->
    <path d="M 30 42 C 24 42 24 56 32 58 C 28 52 28 46 30 42 Z" 
          fill="#FEB481" stroke="#000000" stroke-width="3"/>

    <!-- Rosy Blushing Cheeks -->
    <ellipse cx="58" cy="72" rx="10" ry="7" fill="#FF7088" opacity="0.85"/>
    <ellipse cx="128" cy="82" rx="11" ry="8" fill="#FF7088" opacity="0.85"/>

    <!-- Giant Bushy Black Eyebrows -->
    <g class="street-eyebrow-left">
      <path d="M 48 28 C 59 12 80 12 86 22 C 78 18 62 18 48 28 Z" 
            fill="#000000" stroke="#000000" stroke-width="2.5"/>
    </g>
    <g class="street-eyebrow-right">
      <path d="M 96 22 C 106 10 129 12 138 26 C 126 18 112 18 96 22 Z" 
            fill="#000000" stroke="#000000" stroke-width="2.5"/>
    </g>

    <!-- Big Wide Anime Eyes with Concentric Pupils (From Photo!) -->
    <g class="street-eye-left">
      <ellipse cx="70" cy="38" rx="10" ry="13" fill="#000000"/>
      <ellipse cx="68" cy="35" rx="4.5" ry="5.5" fill="#FFFFFF"/>
      <circle cx="72" cy="43" r="1.8" fill="#FFFFFF"/>
    </g>
    <g class="street-eye-right">
      <ellipse cx="112" cy="40" rx="10" ry="13" fill="#000000"/>
      <ellipse cx="110" cy="37" rx="4.5" ry="5.5" fill="#FFFFFF"/>
      <circle cx="114" cy="45" r="1.8" fill="#FFFFFF"/>
    </g>

    <!-- Singing / Shouting Red Circle Mouth (From Photo!) -->
    <g class="street-mouth-sing">
      <circle cx="94" cy="68" r="14" fill="#E8222E" stroke="#000000" stroke-width="3"/>
      <circle cx="94" cy="70" r="7" fill="#880C14"/>
    </g>

  </g>
</svg>